# Пример ~/.codex/config.toml — только то, что относится к связке с Claude Code.
# НЕ копировать поверх своего конфига: в реальном файле есть личные секции
# (projects с trust_level, marketplaces, пути к бандлам приложения).
# Взять отсюда model, model_reasoning_effort и, если нужно, профиль ревью.

# Слаг модели. Проверять доступность так:
#   codex exec --skip-git-repo-check --sandbox read-only --model gpt-6-astra 'ответь: ok'
# Без --skip-git-repo-check команда откажет вне git-репозитория — и это будет похоже
# на отказ в доступе к модели, хотя дело не в ней.
# Список слагов, которые обслуживает аккаунт — в ~/.codex/models_cache.json (поле slug).
model = "gpt-6-astra"

# Умолчание глубины рассуждений. Отдельные вызовы могут его понижать (high / medium).
model_reasoning_effort = "xhigh"

# Это всё, что нужно для связки с Claude Code.
#
# Настройки веб-поиска, плагины и профили сюда намеренно не вынесены: к работе
# `codex mcp-server` они отношения не имеют. Профиль, в частности, не активируется
# самим фактом регистрации MCP-сервера — режим песочницы и политику подтверждений
# Claude передаёт в каждом вызове параметрами `sandbox` и `approval-policy`.
