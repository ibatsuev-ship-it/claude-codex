# Example ~/.codex/config.toml - only the parts relevant to the Claude Code link.
# Do NOT copy over your own config: the real file has personal sections
# (projects with trust_level, marketplaces, paths to application bundles).
# Take model and model_reasoning_effort from here.

# Model slug. Check availability like this:
#   codex exec --skip-git-repo-check --sandbox read-only --model gpt-6-astra 'reply: ok'
# Without --skip-git-repo-check the command refuses to run outside a git repository,
# which looks like a model access refusal although the model is not the problem.
# The slugs your account serves are in ~/.codex/models_cache.json (field slug).
model = "gpt-6-astra"

# Default reasoning effort. xhigh is noticeably slower and more expensive; the codex-ask
# wrapper raises it for a single thread with --effort xhigh.
model_reasoning_effort = "high"

# If the config still has [features] web_search_request = true, replace it with the
# top-level web_search = "live": in 0.155.1 the old key is deprecated and prints a warning
# on every call.
#
# Profiles: in 0.155.1 `codex -p NAME` reads a separate file ~/.codex/NAME.config.toml,
# not a [profiles.NAME] table in this file. The wrapper does not use profiles.
