# Пример ~/.codex/config.toml - только то, что относится к связке с Claude Code.
# НЕ копировать поверх своего конфига: в реальном файле есть личные секции
# (projects с trust_level, marketplaces, пути к бандлам приложения).
# Взять отсюда model и model_reasoning_effort.

# Слаг модели. Проверять доступность так:
#   codex exec --skip-git-repo-check --sandbox read-only --model gpt-6-astra 'ответь: ok'
# Без --skip-git-repo-check команда откажет вне git-репозитория - и это будет похоже
# на отказ в доступе к модели, хотя дело не в ней.
# Список слагов, которые обслуживает аккаунт - в ~/.codex/models_cache.json (поле slug).
model = "gpt-6-astra"

# Умолчание глубины рассуждений. xhigh заметно дороже и медленнее; обёртка codex-ask
# поднимает его для отдельного треда флагом --effort xhigh.
model_reasoning_effort = "high"

# Если в конфиге остался [features] web_search_request = true - замените его на
# web_search = "live" (верхний уровень): в 0.155.1 старый ключ устарел и печатает
# предупреждение на каждом вызове.
#
# Профили: в 0.155.1 `codex -p NAME` читает отдельный файл ~/.codex/NAME.config.toml,
# а не таблицу [profiles.NAME] в этом файле. Обёртке профили не нужны.
